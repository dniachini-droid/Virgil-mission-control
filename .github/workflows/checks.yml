# The repository's required checks, run by something with no interest in the answer.
#
# Why this file exists. Until now every check this repository has ever reported
# was run by hand, inside the session that also wrote the code, and the report
# of it was prose. `CLAUDE.md` says plainly that a builder's success report is
# not evidence; this workflow is the part that can be evidence. Two review
# findings name the specific hole it closes:
#
#   KR-50/KR-59 — neither `build:owner` nor `verify:owner` was reachable from
#   any required check, and there was no CI at all, so the only guard that
#   catches a network escape in the Owner Build was the one guard nothing ran.
#
#   KR-58 — `owner-build/inline.mjs` scans for external references *before* it
#   reinserts the CSS and *before* it pastes the bundle, so it only ever
#   inspected the bare shell. A remote `url()` in the stylesheet, and a
#   `fetch()` added to a component, both survive it and both survive the unit
#   tests. `verify:owner` catches them, at runtime, from a `file://` URL.
#   This workflow does not fix `inline.mjs`. It makes the check that catches
#   its blind spot unavoidable. Those are different things and the backlog
#   records them separately.
#
# A workflow file is itself editable, so the wiring does not live only here:
# `pnpm check` at the repository root runs `verify:owner` through the turbo
# graph. Deleting this workflow therefore breaks `pnpm test`. The owner builds and verifies below are run twice on
# purpose — once inside `pnpm check` and once explicitly — so that removing
# either path does not remove the guard.
#
# ---------------------------------------------------------------------------
# **Why this file has four jobs and not two: the Keeper's KS4-05 and KS4-06.**
#
# The stage-4 review read the Actions API and found that this branch's own gate
# had never passed: 45 runs, and the `lint, typecheck, tests, owner build,
# owner verify` job had never concluded `success`. Three of them exited 1 at
# `pnpm run verify:owner:v11`; at the reviewed candidate the job hit
# `timeout-minutes: 30` **inside `pnpm check`**, with the Mind Scan, both owner
# builds, both verifies and the digest check all skipped behind it.
#
# The arithmetic is the plain part. Run 41, at the branch point `c2f9651`,
# passed with `pnpm check` taking **2 m 23 s** — and at that commit `pnpm
# check` did not yet run `verify:owner:v11`. That check drives a WebGL scene in
# a software rasteriser across three simulated viewports plus a motion and
# performance tail, and takes about **fifteen minutes** on this class of
# machine. A single sequential job holding lint, typecheck, 1,452 tests, two
# owner builds and two browser verifies inside a thirty-minute cap has almost
# no margin, and run 85 proved it by running out of it at 30 m 17 s.
#
# So: the cap is raised where the work genuinely takes that long and the reason
# is stated rather than assumed, and the job is split the same way the check
# itself was split, into parts that run at the same time. The whole check still
# runs whole, once, inside `pnpm check` — because "it has never run whole,
# anywhere" is the second half of what the review found, and four partial runs
# are four partial runs however sufficient their coverage.
#
# What this does **not** fix, stated so nobody reads a green tick as more than
# it is: whether `verify:owner:v11` passes on the browser the lockfile pins was
# unknown when this was written. `cdn.playwright.dev` is blocked by the build
# environment's egress policy, so every local run anywhere in the record —
# every builder's, both reviewers' — substituted the preinstalled
# `chromium-1194`. CI is the only place the pinned browser is ever used. If a
# part below fails, it fails for a reason that is now readable in its own job's
# log rather than buried in a twenty-five-minute step.
# ---------------------------------------------------------------------------

name: checks

# ---------------------------------------------------------------------------
# **What runs when, and why it stopped running everything on every push.**
#
# On 2026-09-10 this repository exhausted its 2,000 included Actions minutes and
# every run after 05:36 UTC failed in two to four seconds with no runner
# assigned and no logs — a failure that looks exactly like broken code and is
# nothing of the kind. The arithmetic is not subtle: the four jobs below cost
# roughly eighty-five machine-minutes per push, because two of them drive a WebGL
# scene through a software rasteriser, and twenty-five pushes in a day is the
# whole month's allowance.
#
# So the gate moved rather than shrank. **A push runs the fast half** — lint,
# typecheck and every unit test, about four minutes and no browser. **A pull
# request runs everything**, which is the moment it matters, because nothing
# reaches `main` except through one. `workflow_dispatch` runs everything on
# demand for the times a branch needs the full answer without a pull request.
#
# `test/required-checks.test.ts` asserts this arrangement, so the guarantee is
# still enforced by something that fails rather than by this comment.
#
# **There is no `paths-ignore`, and the Keeper's KP2-02 is why.**
#
# This block used to skip pushes touching only `docs/**`, `knowledge/**` or
# `**/*.md`, on the stated ground that *"documents do not change what any of
# these checks measure"*. That sentence was false, and it was false about this
# repository specifically. `packages/knowledge-graph/src/derive.ts` walks
# `docs/decisions/**/(OD|ADR)-NNNN*.md`, `knowledge/raw/**.source.md` and
# `knowledge/wiki/**.md`, and `test/seed-graph.test.ts` asserts the committed
# graph matches a fresh derivation **byte for byte**. Every one of the three
# ignored patterns was an input to that test.
#
# What it cost: commit `3e18c1b` added an owner decision record and nothing else,
# so no check ran, and the suite was broken from that commit until an independent
# review re-ran it with the cache forced off and found it. A skip rule is only as
# good as the claim underneath it, and that claim had never been checked.
#
# So the rule is gone rather than narrowed. A prose-only push now costs the four
# minutes of the fast job, which is the correct price for not having to be right
# about which files feed which test.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# Read-only. Nothing here merges, deploys, publishes or touches a credential.
permissions:
  contents: read

# **A note on this rule, because it is part of why the branch was never green.**
# A push cancels the run in flight. That is right for cost, and it means a
# branch pushed to every few minutes can never finish a thirty-minute run: runs
# 82, 83 and 84 were each cancelled within three minutes of starting. Nothing
# here can fix that except shorter jobs, which is what the split below is for.
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 0. **The fast half: what every push runs.** No browser, no owner build, no
  #    verify — those are the expensive parts and they run on the pull request.
  #    This is the same lint, the same typecheck and the same 1,514 tests a
  #    session runs before pushing, run again by something with no stake in the
  #    answer.
  fast:
    name: lint, typecheck, tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test