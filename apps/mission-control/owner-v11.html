<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      V11's entry, additive to `owner.html`, which is untouched.

      `viewport-fit=cover` lets the document paint under the Dynamic Island and
      the home indicator, which is what makes `env(safe-area-inset-*)` return
      anything but zero. Everything the owner has to read or press is then held
      inside those insets by `owner-v11.css`; only the world paints under them.

      `user-scalable=no` is deliberately NOT set: pinch-zoom is an accessibility
      affordance and refusing it to stop an accidental zoom would be trading a
      real user's need for a cosmetic one.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#04051a" />
    <title>Virgil Mission Control — Owner Build V11</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/owner/main-owner-v11.tsx"></script>
  </body>
</html>
